<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="t d">
  <title id="t">Ayrames Teodósio, Full-Stack Developer</title>
  <desc id="d">Desenvolvedor full-stack com TypeScript, React e Next.js, estudando Ruby on Rails. Base no Brasil (GMT-3), aberto a oportunidades.</desc>
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .m{font-family:'Consolas','Courier New',monospace}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.5;transform:scale(2.2)}}
    .route{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.5s ease-in-out .15s 1 both}
    .halo{opacity:.2;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){
      .route{animation:none;stroke-dashoffset:0}
      .halo{animation:none;opacity:.2;transform:none}
    }
  </style>

  <rect x="0.5" y="0.5" width="879" height="259" rx="10" fill="#0E0E10" stroke="#2A2A33"/>

  <!-- Coluna esquerda (x=52) -->
  <text class="t" x="52" y="64" font-size="11" font-weight="600" letter-spacing="2.6" fill="#5EA0FF" textLength="192" lengthAdjust="spacing">FULL-STACK DEVELOPER</text>
  <text class="t" x="52" y="128" font-size="54" font-weight="600" fill="#FFFFFF" textLength="440" lengthAdjust="spacingAndGlyphs">Ayrames Teodósio</text>
  <text class="t" x="52" y="162" font-size="20" fill="#FFFFFF" textLength="266" lengthAdjust="spacingAndGlyphs">Do pixel ao banco de dados.</text>
  <text class="t" x="52" y="188" font-size="14" fill="#A8A8B3" textLength="372" lengthAdjust="spacingAndGlyphs">TypeScript, React e Next.js. Estudando Ruby on Rails.</text>

  <!-- Coluna direita: bloco de cronometragem (x 528 a 828) -->
  <g stroke="#2A2A33" stroke-width="1">
    <line x1="528" y1="56.5" x2="828" y2="56.5"/>
    <line x1="528" y1="90.5" x2="828" y2="90.5"/>
    <line x1="528" y1="124.5" x2="828" y2="124.5"/>
    <line x1="528" y1="158.5" x2="828" y2="158.5"/>
    <line x1="528" y1="192.5" x2="828" y2="192.5"/>
  </g>
  <g class="t" font-size="9" letter-spacing="1.6" fill="#A8A8B3">
    <text x="528" y="77">BASE</text>
    <text x="528" y="111">FOCO</text>
    <text x="528" y="145">ESTUDANDO</text>
    <text x="528" y="179">STATUS</text>
  </g>
  <g class="m" font-size="11" fill="#FFFFFF">
    <text x="740" y="77" textLength="88" lengthAdjust="spacingAndGlyphs">Brasil (GMT-3)</text>
    <text x="639" y="111" textLength="189" lengthAdjust="spacingAndGlyphs">Desenvolvimento web full-stack</text>
    <text x="746" y="145" textLength="82" lengthAdjust="spacingAndGlyphs">Ruby on Rails</text>
    <text x="689" y="179" textLength="139" lengthAdjust="spacingAndGlyphs">Aberto a oportunidades</text>
  </g>
  <circle class="halo" cx="677" cy="175" r="3" fill="#1E6BFF"/>
  <circle cx="677" cy="175" r="3" fill="#1E6BFF"/>

  <!-- Traçado de circuito de largura total -->
  <path d="M52 234 H128 C147 234 156 220 175 220 H258 L295 242 H370 C389 242 396 226 417 226 H508 C531 226 538 236 560 236 H640 L677 218 H746 C765 218 774 230 783 230 H828" fill="none" stroke="#2A2A33" stroke-width="1.5"/>
  <path class="route" pathLength="1" d="M52 234 H128 C147 234 156 220 175 220 H258 L295 242 H370 C389 242 396 226 417 226 H508 C531 226 538 236 560 236 H640 L677 218 H746 C765 218 774 230 783 230 H828" fill="none" stroke="#1E6BFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Marcas de setor -->
  <g stroke="#A8A8B3" stroke-width="1">
    <line x1="230.5" y1="215" x2="230.5" y2="225"/>
    <line x1="480.5" y1="221" x2="480.5" y2="231"/>
    <line x1="720.5" y1="213" x2="720.5" y2="223"/>
  </g>
  <g class="m" font-size="9" fill="#A8A8B3" text-anchor="middle">
    <text x="230.5" y="239">S1</text>
    <text x="480.5" y="245">S2</text>
    <text x="720.5" y="237">S3</text>
  </g>
</svg>
